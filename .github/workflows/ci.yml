# Continuous integration for MedLink.
#
# WHY THESE PARTICULAR CHECKS. Each one corresponds to a defect that actually
# reached the repository and was found by hand:
#
#   · index.ts imported ./middleware/rateLimit and ./routes/security, neither of
#     which had ever been committed — a fresh clone could not start the backend
#     at all. Invisible from a working tree that had the files.
#   · routes/permissions.ts was committed importing pushToUser while the export
#     lived only in a working tree, leaving HEAD unbootable.
#   · tests/crypto.test.ts was committed without the source fix it asserts, so
#     the committed suite failed against the committed source.
#
# All three share one shape: the working tree was fine and the repository was
# not. So the jobs below deliberately test what is COMMITTED, in a clean
# checkout, rather than whatever happens to be on a developer's disk.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # ── The check that would have caught the worst of them ──────────────────────
  backend:
    name: Backend — boots and passes its tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthcare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test-only values. The suite refuses to run against a database whose name
      # does not contain "test", so this cannot touch anything real.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthcare_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthcare_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      AES_SECRET_KEY: ci-only-aes-key-not-used-anywhere-else-0123456
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Apply the schema
        working-directory: backend
        run: bun run db:push --force

      # This is the step that catches a missing or uncommitted module. Importing
      # the entry point resolves every route, service and middleware in the
      # dependency graph; anything absent from the commit fails here.
      - name: Backend boots from a clean checkout
        working-directory: backend
        run: bun -e 'await import("./src/index.ts"); console.log("boots"); process.exit(0);'

      - name: Tests
        working-directory: backend
        run: bun test

  chaincode:
    name: Chaincode — contracts pass their tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        working-directory: fabric-network/chaincode
        run: bun install

      # The contracts are deployed to peers, so they must compile cleanly as
      # well as pass their tests.
      - name: Typecheck
        working-directory: fabric-network/chaincode
        run: npx tsc --noEmit

      - name: Tests
        working-directory: fabric-network/chaincode
        run: bun test

  web:
    name: Web — typechecks and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # next.config.ts sets typescript.ignoreBuildErrors, so `next build` alone
      # would not fail on a type error. Run the typechecker explicitly.
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  mobile:
    name: Mobile — typechecks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

  hygiene:
    name: Hygiene — no secrets or dependencies committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fabric MSP private keys were committed to this repository once. They are
      # regenerated by start-network.sh, so there is never a reason for one to
      # be tracked.
      - name: No private keys tracked
        run: |
          if git ls-files | grep -E 'priv_sk$|_sk$|\.key$' | grep -v '\.example'; then
            echo "::error::Private key material is tracked. Regenerate it with start-network.sh and add it to .gitignore."
            exit 1
          fi
          echo "No private keys tracked."

      # 4,925 files of chaincode node_modules were tracked, making up 118 MB of
      # a 152 MB repository.
      - name: No node_modules tracked
        run: |
          if git ls-files | grep -q 'node_modules/'; then
            echo "::error::node_modules is tracked. Remove it with: git rm -r --cached <path>/node_modules"
            exit 1
          fi
          echo "No node_modules tracked."

      - name: No .env tracked
        run: |
          # blockchain-explorer is vendored Hyperledger Explorer 2.0.0; its own
          # .env holds ports and paths, no credentials, and is not ours to change.
          if git ls-files | grep -E '(^|/)\.env$' | grep -v 'blockchain-explorer/'; then
            echo "::error::A .env file is tracked. Commit .env.example instead."
            exit 1
          fi
          echo "No .env files tracked."

      # The one that catches a hard-coded developer path, as shipped in
      # next.config.ts and start-network.sh.
      - name: No machine-specific paths
        run: |
          # Scoped to code we own: blockchain-explorer is vendored upstream and
          # ships sample configs full of its author's paths. Explanatory comments
          # about the old paths are not path dependencies.
          if git grep -nE '/home/[a-z]+/|\$HOME/Project/' -- \
              'backend/**' 'web/**' 'mobile/**' 'fabric-network/network/**' \
              'fabric-network/chaincode/src/**' \
              ':!*.example' ':!**/node_modules/**' ':!**/*.test.ts' \
              | grep -v 'previously pointed at' | grep -v 'under \$HOME' \
              | grep -v 'rather than a fixed'; then
            echo "::error::A path tied to one machine is committed. Derive it from __dirname or the script location."
            exit 1
          fi
          echo "No machine-specific paths."
