Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: organizations/ordererOrganizations/healthcare.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer.healthcare.com:7050

  - &HospitalOrg
    Name: HospitalOrgMSP
    ID: HospitalOrgMSP
    MSPDir: organizations/peerOrganizations/hospital.healthcare.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('HospitalOrgMSP.admin', 'HospitalOrgMSP.peer', 'HospitalOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('HospitalOrgMSP.admin', 'HospitalOrgMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('HospitalOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('HospitalOrgMSP.peer')"

  - &PractitionerOrg
    Name: PractitionerOrgMSP
    ID: PractitionerOrgMSP
    MSPDir: organizations/peerOrganizations/practitioner.healthcare.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('PractitionerOrgMSP.admin', 'PractitionerOrgMSP.peer', 'PractitionerOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('PractitionerOrgMSP.admin', 'PractitionerOrgMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('PractitionerOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('PractitionerOrgMSP.peer')"

  - &PatientOrg
    Name: PatientOrgMSP
    ID: PatientOrgMSP
    MSPDir: organizations/peerOrganizations/patient.healthcare.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('PatientOrgMSP.admin', 'PatientOrgMSP.peer', 'PatientOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('PatientOrgMSP.admin', 'PatientOrgMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('PatientOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('PatientOrgMSP.peer')"

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.healthcare.com:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.healthcare.com
        Port: 7050
        ClientTLSCert: organizations/ordererOrganizations/healthcare.com/orderers/orderer.healthcare.com/tls/server.crt
        ServerTLSCert: organizations/ordererOrganizations/healthcare.com/orderers/orderer.healthcare.com/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  HealthcareOrdererGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Consortiums:
      HealthcareConsortium:
        Organizations:
          - *HospitalOrg
          - *PractitionerOrg
          - *PatientOrg

  HealthcareChannel:
    Consortium: HealthcareConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *HospitalOrg
        - *PractitionerOrg
        - *PatientOrg
      Capabilities: *ApplicationCapabilities
  HealthcareChannelGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *HospitalOrg
        - *PractitionerOrg
        - *PatientOrg
      Capabilities: *ApplicationCapabilities
