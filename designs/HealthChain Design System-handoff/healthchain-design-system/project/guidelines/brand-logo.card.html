<!-- @dsCard group="Brand" viewport="700x200" name="Logo & wordmark" subtitle="Shield + interlocking-link cross · clear-space and lockups" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-card);padding:24px;display:flex;align-items:center;gap:40px;flex-wrap:wrap}
  .lockup{display:flex;align-items:center;gap:12px}
  .wm{font-family:var(--font-display);font-weight:600;font-size:24px;color:var(--text-primary);letter-spacing:-0.01em}
  .wm b{color:var(--brand)}
  .onbrand{background:var(--brand);padding:18px 22px;border-radius:var(--r-lg);display:flex;align-items:center;gap:12px}
  .onbrand .wm{color:#fff}
  .onbrand .wm b{color:#fff}
  .scale{display:flex;align-items:flex-end;gap:16px}
</style></head>
<body>
  <div class="lockup">
    <img src="../assets/logo-mark.svg" width="48" height="48" alt="HealthChain">
    <span class="wm">Health<b>Chain</b></span>
  </div>
  <div class="onbrand">
    <img src="../assets/logo-mark.svg" width="40" height="40" alt="" style="filter:brightness(0) invert(1)">
    <span class="wm">Health<b>Chain</b></span>
  </div>
  <div class="scale">
    <img src="../assets/logo-mark.svg" width="56" height="56" alt="">
    <img src="../assets/logo-mark.svg" width="36" height="36" alt="">
    <img src="../assets/logo-mark.svg" width="24" height="24" alt="">
  </div>
</body></html>
