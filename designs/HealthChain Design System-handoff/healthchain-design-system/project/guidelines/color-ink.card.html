<!-- @dsCard group="Colors" viewport="700x180" name="Ink & surfaces" subtitle="Text ink ramp, app surfaces and hairline borders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-card);padding:20px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:92px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border)}
  .chip{height:56px}
  .meta{padding:7px 9px}
  .name{font-size:11px;font-weight:600;color:var(--text-primary)}
  .hex{font-size:11px;font-family:var(--font-mono);color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="meta"><div class="name">ink-900</div><div class="hex">#0A0E1A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="meta"><div class="name">soft · 500</div><div class="hex">#4B5563</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-400)"></div><div class="meta"><div class="name">muted · 400</div><div class="hex">#9CA3AF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="meta"><div class="name">subtle · 300</div><div class="hex">#D1D5DB</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-app)"></div><div class="meta"><div class="name">app bg</div><div class="hex">#FAFAFB</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--white);border-bottom:1px solid var(--border)"></div><div class="meta"><div class="name">card</div><div class="hex">#FFFFFF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--border-200)"></div><div class="meta"><div class="name">border</div><div class="hex">#E5E7EB</div></div></div>
  </div>
</body></html>
