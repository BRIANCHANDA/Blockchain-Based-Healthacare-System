<!-- @dsCard group="Type" viewport="700x230" name="Body, meta & mono" subtitle="DM Sans body/meta · DM Mono for IDs, codes and QR payload" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-card);padding:24px;color:var(--text-primary)}
  .stack{display:flex;flex-direction:column;gap:14px;max-width:560px}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-bottom:4px}
  .body-lg{font:var(--text-body-lg)}
  .body{font:var(--text-body)}
  .meta{font:var(--text-meta);color:var(--text-secondary)}
  .mono{font-family:var(--font-mono);font-size:14px;color:var(--text-primary);letter-spacing:0.02em}
</style></head>
<body>
  <div class="stack">
    <div><div class="tag">body-lg · 17</div><div class="body-lg">This code contains only your patient ID — no medical information.</div></div>
    <div><div class="tag">body · 15</div><div class="body">Staff still need your permission to view your records.</div></div>
    <div><div class="tag">meta · 13 medium</div><div class="meta">Recorded 14 Jun 2026 · University Teaching Hospital</div></div>
    <div><div class="tag">mono · IDs & codes</div><div class="mono">VIS-2026-A3F2 · ICD J45.909 · NRC 123456/78/9</div></div>
  </div>
</body></html>
