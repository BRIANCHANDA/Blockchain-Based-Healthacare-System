<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="8pt base grid with 4px half-steps" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-card);padding:24px}
  .row{display:flex;align-items:flex-end;gap:16px}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--green-100);border:1px solid var(--green-300);border-radius:4px}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}
  .px{font-size:10px;color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="width:4px;height:4px"></div><div class="lbl">sp-1</div><div class="px">4</div></div>
    <div class="col"><div class="bar" style="width:8px;height:8px"></div><div class="lbl">sp-2</div><div class="px">8</div></div>
    <div class="col"><div class="bar" style="width:12px;height:12px"></div><div class="lbl">sp-3</div><div class="px">12</div></div>
    <div class="col"><div class="bar" style="width:16px;height:16px"></div><div class="lbl">sp-4</div><div class="px">16</div></div>
    <div class="col"><div class="bar" style="width:24px;height:24px"></div><div class="lbl">sp-6</div><div class="px">24</div></div>
    <div class="col"><div class="bar" style="width:32px;height:32px"></div><div class="lbl">sp-8</div><div class="px">32</div></div>
    <div class="col"><div class="bar" style="width:48px;height:48px"></div><div class="lbl">sp-12</div><div class="px">48</div></div>
    <div class="col"><div class="bar" style="width:64px;height:64px"></div><div class="lbl">sp-16</div><div class="px">64</div></div>
  </div>
</body></html>
