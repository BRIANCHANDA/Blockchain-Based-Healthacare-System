<!-- @dsCard group="Colors" viewport="700x180" name="Brand green" subtitle="Primary green ramp — trust, vitality, the granted/healthy state" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-card);padding:20px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:96px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border)}
  .chip{height:56px}
  .meta{padding:7px 9px}
  .name{font-size:11px;font-weight:600;color:var(--text-primary)}
  .hex{font-size:11px;font-family:var(--font-mono);color:var(--text-muted)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--green-900)"></div><div class="meta"><div class="name">green-900</div><div class="hex">#064E3B</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--green-800)"></div><div class="meta"><div class="name">deep · 800</div><div class="hex">#047857</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--green-700)"></div><div class="meta"><div class="name">PRIMARY · 700</div><div class="hex">#059669</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--green-600)"></div><div class="meta"><div class="name">green-600</div><div class="hex">#10B981</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--green-100)"></div><div class="meta"><div class="name">light · 100</div><div class="hex">#D1FAE5</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--green-050)"></div><div class="meta"><div class="name">ghost · 050</div><div class="hex">#ECFDF5</div></div></div>
  </div>
</body></html>
