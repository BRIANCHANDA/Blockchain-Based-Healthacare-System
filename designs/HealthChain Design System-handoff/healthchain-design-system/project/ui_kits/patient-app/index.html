<!-- @dsCard group="Patient App" viewport="480x900" name="HealthChain Patient App" subtitle="Interactive mobile app — login, records, visit detail, access, trends, referrals, profile" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HealthChain — Patient App</title>
  <link rel="stylesheet" href="../../styles.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--font-sans);
      background: radial-gradient(120% 80% at 50% 0%, #EEF6F2 0%, #E7ECEA 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    button { font-family: inherit; }
    /* hide scrollbars inside the app for a native feel */
    .hc-app-root *::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>
  <div id="root" class="hc-app-root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- design system bundle (generated at build) -->
  <script src="../../_ds_bundle.js"></script>
  <!-- sample data -->
  <script src="data.js"></script>

  <!-- device frame + screens + app (in-browser Babel) -->
  <script type="text/babel" src="android-frame.jsx"></script>
  <script type="text/babel" src="screens/Login.jsx"></script>
  <script type="text/babel" src="screens/RecordsHome.jsx"></script>
  <script type="text/babel" src="screens/VisitDetail.jsx"></script>
  <script type="text/babel" src="screens/HospitalId.jsx"></script>
  <script type="text/babel" src="screens/AccessCenter.jsx"></script>
  <script type="text/babel" src="screens/HealthTrends.jsx"></script>
  <script type="text/babel" src="screens/Referrals.jsx"></script>
  <script type="text/babel" src="screens/Profile.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel" data-presets="react">
    function HCFrame() {
      const Device = window.AndroidDevice;
      const PatientApp = window.HCApp;
      return (
        <Device width={412} height={880}>
          <PatientApp />
        </Device>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<HCFrame />);
  </script>
</body>
</html>
