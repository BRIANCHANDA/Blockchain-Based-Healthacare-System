<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-bg);padding:22px}
.phone{width:320px;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface-bg)}
.stack{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.lbl{font:600 11px/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { TabBar, ScreenHeader, IconButton, TrustBadge } = window.HealthChainDesignSystem_9f6dff;
function Demo(){
  const [tab,setTab] = React.useState('access');
  const tabs = [
    {id:'records',label:'Records',icon:'file-text'},
    {id:'access',label:'Access',icon:'shield-check',badge:2},
    {id:'history',label:'History',icon:'activity'},
    {id:'referrals',label:'Referrals',icon:'send'},
  ];
  return (<div className="stack">
    <div>
      <div className="lbl">Headers</div>
      <div style={{width:320,display:'flex',flexDirection:'column',gap:14}}>
        <ScreenHeader large title="Records" subtitle="Mwila Banda" right={<IconButton icon="bell" label="Alerts" badge/>}/>
        <ScreenHeader title="Visit VIS-2026-A3F2" onBack={()=>{}} right={<TrustBadge kind="encrypted" size="sm"/>}/>
      </div>
    </div>
    <div>
      <div className="lbl">Bottom tab bar</div>
      <div className="phone"><div style={{height:14}}/><TabBar active={tab} tabs={tabs} onSelect={setTab}/></div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
