<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-bg);padding:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.lbl{font:600 11px/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Input, PermissionChip } = window.HealthChainDesignSystem_9f6dff;
const SCOPES = ['visits','vitals','diagnoses','prescriptions','lab-results','imaging'];
function Demo(){
  const [sel,setSel] = React.useState(['visits','vitals']);
  const toggle = (s)=> setSel(p=> p.includes(s)? p.filter(x=>x!==s): [...p,s]);
  return (<div>
    <div className="grid">
      <Input label="National ID" icon="fingerprint" value="123456/78/9" inputMode="numeric" onChange={()=>{}}/>
      <Input label="Password" type="password" icon="lock" value="medical-grade" onChange={()=>{}}/>
      <Input label="National ID" icon="fingerprint" value="000" error="Invalid credentials" onChange={()=>{}}/>
      <Input label="Phone" icon="user" placeholder="+260 …" helper="Used for sign-in alerts" onChange={()=>{}}/>
    </div>
    <div className="lbl">Permission chips (tap to toggle)</div>
    <div className="row">{SCOPES.map(s=> <PermissionChip key={s} scope={s} selected={sel.includes(s)} onToggle={toggle}/>)}</div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
